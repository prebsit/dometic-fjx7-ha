# Dometic FJX/FJZ bridge — Home Assistant only
#
# secrets.yaml next to this file needs:
#   wifi_ssid, wifi_password
#   encryption_key   (generate with: openssl rand -base64 32)
#
# ac_mac is the AC's Bluetooth MAC (AA:BB:CC:DD:EE:FF), NOT its SHE_xxxxxx
# name, and an iPhone can't show it. See "Finding the AC's address" in the
# README, or build board-in-a-box.yaml instead and pair by name.

substitutions:
  name: dometic-ac
  friendly_name: "Dometic AC Bridge"
  board: esp32-s3-devkitm-1          # ESP32-S3 SuperMini / DevKitM
  ac_mac: "XX:XX:XX:XX:XX:XX"        # Bluetooth MAC, not the SHE_ name
  encryption_key: !secret encryption_key
  fjx7_ref: v0.5.0-rc.2                   # keep in step with `ref:` below

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

packages:
  fjx7:
    url: https://github.com/prebsit/dometic-fjx7-ha
    ref: v0.5.0-rc.2
    files:
      - packages/core.yaml
      - packages/ha.yaml
      # - packages/adaptive_power.yaml   # FJZ: yes. FJX: untested, try it and report back
    refresh: 1d
