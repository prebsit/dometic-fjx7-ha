# Dometic FJX/FJZ bridge — "board in a box" firmware
#
# Flash once, then set everything up from a phone. Nothing about the van is
# compiled in:
#   - WiFi: the board starts a setup hotspot, <name>-xxxxxx, with its own
#     password derived from ap_key and the board's MAC (tools/ap_card.py
#     prints it). Join it, open http://192.168.4.1, pick the van WiFi.
#   - AC: hold + and - on the AC panel for 3 s; the board pairs with that unit.
#   - Victron/Node-RED: type the GX's IP into the board's web page.
#   - Home Assistant: adopt the board in HA; HA sets the API key.
#   - Factory reset: unplug and replug 5 times (each within 10 s), or hold
#     BOOT for 10 s, or use the web page.
#
# secrets.yaml next to this file needs:
#   encryption_key   OTA key (openssl rand -base64 32). Keep it: you need it
#                    to update the board over the network later.
#   ap_key           hotspot master key (openssl rand -hex 16). Keep it
#                    secret and never publish firmware built with it: anyone
#                    with ap_key and a board's MAC can work out its hotspot
#                    password. The build refuses to run without one.

substitutions:
  name: fjx7-bridge
  friendly_name: "Dometic AC Bridge"
  board: esp32-s3-devkitm-1          # ESP32-S3 SuperMini / DevKitM
  ac_mac: "00:00:00:00:00:00"        # leave: the board pairs by itself
  encryption_key: !secret encryption_key
  ap_key: !secret ap_key
  fjx7_ref: v0.5.0-rc.1              # keep in step with `ref:` below

packages:
  fjx7:
    url: https://github.com/prebsit/dometic-fjx7-ha
    ref: v0.5.0-rc.1
    files:
      - packages/core.yaml
      - packages/provisioning.yaml   # setup hotspot + captive portal
      - packages/autopair.yaml       # pair via + and - on the AC panel
      - packages/ha.yaml             # Home Assistant
      - packages/mqtt.yaml           # Victron / Node-RED (off until set on the page)
      - packages/webpage.yaml        # control and setup page
      - packages/reset.yaml          # 5 power cycles / BOOT 10 s factory reset
      # - packages/adaptive_power.yaml   # FJZ only
    refresh: 1d

# Let Home Assistant adopt the board and set its own API key, instead of
# baking one in that the owner would have to be told.
api:
  encryption:
    key: !remove
