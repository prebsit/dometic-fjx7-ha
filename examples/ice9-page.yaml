# The box firmware as an ice9 runs it: board-in-a-box.yaml with the ice9 page
# (page/ice9.css and page/ice9.js) in place of ESPHome's stock web interface,
# and the ice9's own setup screen on the setup hotspot. Everything else is the
# same: pairing, Home Assistant, MQTT, the page password, updates, the kept
# log, factory reset.
#
# Unlike board-in-a-box.yaml this builds from THIS checkout (the packages, the
# page and the ice9's own components are read from disk), so run it from a
# clone of this repository at a release tag.
#
# secrets.yaml next to this file needs the same two secrets as
# board-in-a-box.yaml, encryption_key and ap_key. Use the ones the board was
# built with: then it can be updated over WiFi, and its hotspot password stays
# the one on its card.
#
# For a blank test board, make your own. ap_key must be 32 characters or more,
# or the build stops at a static_assert in provisioning.yaml:
#
#   encryption_key: openssl rand -base64 32
#   ap_key:         openssl rand -hex 16
#
#   esphome run examples/ice9-page.yaml

substitutions:
  lock_source: ../components       # ice9_lock and ice9_log from this checkout
  # The box is ice9-<ID>: setup hotspot, .local address and the name the
  # router shows (provisioning.yaml adds the ID, the last 6 hex digits of the
  # MAC: the box's serial).
  name: ice9
  # What Home Assistant calls the device and its entities, e.g.
  # "Dometic Aircon abcdef AC". ESPHome adds the ID to this too.
  friendly_name: "Dometic Aircon"
  board: esp32-s3-devkitm-1          # ESP32-S3 SuperMini / DevKitM
  ac_mac: "00:00:00:00:00:00"        # leave: the board pairs by itself
  encryption_key: !secret encryption_key
  ap_key: !secret ap_key
  fjx7_ref: v1.0.0-rc.1                   # the AC component comes from GitHub at this tag: keep it in step with your clone

packages:
  core: !include ../packages/core.yaml
  provisioning: !include ../packages/provisioning.yaml   # setup hotspot + captive portal
  autopair: !include ../packages/autopair.yaml           # pair via + and - on the AC panel
  ha: !include ../packages/ha.yaml                       # Home Assistant
  mqtt: !include ../packages/mqtt.yaml                   # Victron / Node-RED (off until set on the page)
  webpage: !include ../packages/webpage.yaml             # the settings behind the page
  reset: !include ../packages/reset.yaml                 # 5 power cycles / BOOT 10 s factory reset
  # The FJZ's power limit. In every box: an FJX never reports one, and the page
  # only shows the control once the aircon has.
  adaptive_power: !include ../packages/adaptive_power.yaml

# Let Home Assistant adopt the board and set its own API key, instead of
# baking one in that the owner would have to be told.
api:
  encryption:
    key: !remove

# Swap the page. With `local: false` ESPHome serves a bare shell that loads
# only /0.css and /0.js (web_server/__init__.py, build_index_html); the empty
# js_url stops it also fetching the stock interface from oi.esphome.io.
# The paths are relative to this file.
web_server:
  local: false
  js_url: ""
  css_include: ../page/ice9.css
  js_include: ../page/ice9.js
