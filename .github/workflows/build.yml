name: Build

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly: catch ESPHome releases breaking us before users do
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 2026.3.0 = last release before the entity-level custom fan mode API
        # latest   = current stable
        # dev      = early warning (e.g. 2026.11 removals)
        esphome: ["2026.3.0", "latest", "dev"]
        config: ["fjx-minimal", "fjz-full"]
    continue-on-error: ${{ matrix.esphome == 'dev' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: |
          case "${{ matrix.esphome }}" in
            latest) pip install esphome ;;
            dev)    pip install "esphome @ git+https://github.com/esphome/esphome.git@dev" ;;
            *)      pip install "esphome==${{ matrix.esphome }}" ;;
          esac
          esphome version
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ matrix.esphome }}-${{ hashFiles('tests/*.yaml') }}
      - name: Compile
        run: esphome compile tests/${{ matrix.config }}.yaml

  # The packages/ building blocks (need ESPHome 2026.9+ for encrypted OTA).
  # core.yaml pulls the component from GitHub at ${fjx7_ref}; point it at the
  # commit under test so the packages and the component are built together.
  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        esphome: ["latest", "dev"]
        config: ["packages-all", "packages-mqtt-only", "packages-box"]
    continue-on-error: ${{ matrix.esphome == 'dev' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: |
          case "${{ matrix.esphome }}" in
            latest) pip install esphome ;;
            dev)    pip install "esphome @ git+https://github.com/esphome/esphome.git@dev" ;;
          esac
          esphome version
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-pkg-${{ matrix.esphome }}-${{ hashFiles('tests/*.yaml', 'packages/*.yaml') }}
      - name: Compile
        run: esphome -s fjx7_ref ${{ github.event.pull_request.head.sha || github.sha }} compile tests/${{ matrix.config }}.yaml
